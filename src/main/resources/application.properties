spring.application.name=ifweb
server.port=8081

# Khi chạy sau reverse proxy (nginx), tôn trọng header X-Forwarded-* để
# ServletUriComponentsBuilder sinh đúng URL ảnh (vd: http://domain/uploads/...).
# Mặc định "none" để chạy local trực tiếp; Docker đặt "framework".
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}

# ==================== DATABASE ====================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ifweb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ==================== JWT ====================
app.jwt.secret=${APP_JWT_SECRET:infinity-team-super-secret-key-must-be-at-least-256-bits-long}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# ==================== CORS ====================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ==================== UPLOAD ====================
# Thư mục lưu ảnh tải lên (tương đối với thư mục chạy app, hoặc tuyệt đối trong Docker)
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
