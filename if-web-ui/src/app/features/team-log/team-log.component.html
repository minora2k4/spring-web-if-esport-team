<section class="section">
  <div class="container">
    <div class="section-head">
      <h2 class="section-title">Nhật ký <span>đội</span></h2>
      <p class="section-sub">Dòng thời gian các cột mốc và biến động của Infinity Team.</p>
      <div class="divider"></div>
    </div>

    <div class="loader" *ngIf="loading()"><div class="spinner"></div></div>

    <ng-container *ngIf="!loading()">
      <div class="log-list" *ngIf="logs().length; else empty">
        <article class="log-item card card-hover" *ngFor="let l of logs()">
          <div class="log-icon">{{ icon(l.type) }}</div>
          <div class="log-body">
            <div class="log-head">
              <span class="badge" [ngClass]="badgeClass(l.type)">{{ label(l.type) }}</span>
              <span class="log-date" *ngIf="l.eventDate">{{ l.eventDate | date: 'dd/MM/yyyy' }}</span>
            </div>
            <p class="log-desc">{{ l.description }}</p>
            <p class="log-member text-muted" *ngIf="l.member">👤 {{ l.member.inGameName }}</p>
          </div>
        </article>
      </div>
      <ng-template #empty>
        <div class="empty-state"><div class="empty-icon">📋</div>Chưa có nhật ký nào.</div>
      </ng-template>
    </ng-container>
  </div>
</section>
