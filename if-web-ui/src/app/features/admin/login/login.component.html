<div class="login-page">
  <div class="login-card card">
    <div class="login-brand">
      <span class="logo-mark">∞</span>
      <span>INFINITY<b>TEAM</b></span>
    </div>

    <h2 class="login-title">Đăng nhập quản trị</h2>
    <p class="login-sub">Khu vực chỉ dành cho quản trị viên.</p>

    <div class="alert alert-error" *ngIf="error">⚠️ {{ error }}</div>

    <div class="field">
      <label class="label">Tên đăng nhập</label>
      <input class="input" type="text" [(ngModel)]="username"
             placeholder="Nhập tên đăng nhập" autocomplete="username" (keyup.enter)="login()" />
    </div>

    <div class="field">
      <label class="label">Mật khẩu</label>
      <input class="input" type="password" [(ngModel)]="password"
             placeholder="Nhập mật khẩu" autocomplete="current-password" (keyup.enter)="login()" />
    </div>

    <button class="btn btn-primary btn-block" (click)="login()" [disabled]="loading">
      {{ loading ? 'Đang đăng nhập...' : 'Đăng nhập' }}
    </button>
  </div>
</div>
